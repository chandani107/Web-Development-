<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class</title>
    <style>
        a:link{
            color: blue;
        }
        a:visited{
            color: purple;

        }
        a:hover{
            color: green;
            font-size: 25px;
        }
        a:active{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Css link pseudo class</h1>
    <a href="https://www.google.com/"> google</a>
    <a href="https://www.firefox.com/">firefox</a>
    
</body>
</html>
