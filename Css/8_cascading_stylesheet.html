<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading stylesheet</title>
    <link rel="stylesheet" href="cascading_stylesheet.css">
    <style>
        div{
            height: 200px;
            width: 200px;
            border: 1px solid black;
        }
        
        .tow{
            background-color: rgb(38, 115, 117);
        }
    </style>
</head>
<body>
    <div class="one" style="background-color: cadetblue;">1</div>
    <div class="tow">2</div>
    <div class="three">3</div>
    
</body>
</html>
