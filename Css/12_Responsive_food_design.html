<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Restaurant</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(235, 235, 235);
        }
        header{
            background-color: rgb(182, 13, 13);
            color: white;
            padding: 25px;
            text-align: center;
        }
        nav{
            background-color: rgb(43, 42, 42);
            padding: 15px;
            text-align: center;
        }
        nav a{
            color: rgb(252, 255, 254);
            text-decoration: none;
            margin: 20px;
        }
        .container{
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }
        .food{
            background-color: brown;
            width: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgb(129, 127, 127);
        }
        .food img{
            height: 500px;
            width: 500px;
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            
        }
        button{
            background-color: black;
            color: aliceblue;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover{
            transform:scale(1.2);
            background-color: rgb(255, 253, 253);
            color: black;
            box-shadow: 0 5px 10px gray;
        }
    </style>
</head>
<body>
    <header>
        <h1>Foodie Restaurant</h1>
        <p>Delicious food, happy life!</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="food">
            <img src="pizza img.jpg" alt="pizza">
            <h2>Pizza</h2>
            <p>Cheesy and Delicious.</p>
            <button>Order now</button>
        </div>
        <div class="food">
            <img src="momo img.jpg" alt="momos">
            <h2>Momos</h2>
            <p>fresh and juciy momo.</p>
            <button>Order now</button>
        </div>
        <div class="food">
            <img src="pani pari im.jpg" alt="pani puri">
            <h2>Pani Puri</h2>
            <p>Cold and Delicious panipuri.</p>
            <button>Order now</button>
        </div>
    </div>
</body>
</html>
