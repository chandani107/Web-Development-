<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME PAGE</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7ddf7;
        }

        nav {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border-radius:0 0 5px 5px ;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: rgb(0, 0, 0);
        }

        .home {
            text-align: center;
            padding: 60px;
            background-color: rgb(255, 184, 240);
        }

        .home h1 {
            font-size: 40px;
            color: #333;
        }

        .home p {
            font-size: 18px;
        }

        .home button {
            padding: 12px 25px;
            background-color: rgb(2, 0, 2);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }

        .home button:hover {
            background-color: purple;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background-color: rgb(255, 211, 245);
            padding: 25px;
            width: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card:hover {
            background-color: rgb(245, 224, 255);

        }

        footer {
            background-color: #333;
            padding: 15px;
            text-align: center;
            color: white;
            border-radius:  5px 5px 0 0 ;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

    </nav>
    <div class="home">
        <h1>Welcome to my website!</h1>
        <p>learn, explore and create something amazing</p>
        <button>Get Started</button>
    </div>
    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <p>creat the structrure of website.</p>
        </div>
        <div class="card">
            <h2>CSS</h2>
            <p>make your website beatutiful.</p>
        </div>
        <div class="card">
            <h2>javascript</h2>
            <p>add functionality to your website.</p>
        </div>
    </div>
    <footer>
        <p>&#xa9;my website | All Right Reserved.</p>
    </footer>

</body>

</html>
