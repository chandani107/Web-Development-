<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(217, 237, 255);
            text-align: center;
        }
        h1{
            color: rgb(54, 135, 255);
        }
        .container{
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .card{
            background-color: white;
            width: 250px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgb(136, 191, 255);
        }
        @media(max-width:768px){
            body{
                background-color: lightyellow;
            }
            h1{
                color: orange;
            }
            .card{
                width: 40%;
            }
        }
        @media(max-width:480px){
            body{
                background-color: lightpink;
            }
            h1{
                color: blanchedalmond;
                font-size:24px;
            }
        }
    </style>
</head>
<body>
    <h1>
        Our Students
    </h1>
    <div class="container">
        <div class="card">
            <h2>Chandani</h2>
            <p>Web Developer</p>
        </div>
        <div class="card">
            <h2>Amita</h2>
            <p>Css Designer</p>
        </div>
        <div class="card">
            <h2>diya</h2>
            <p>Android Developer</p>
        </div>
    </div>
    
</body>
</html>
